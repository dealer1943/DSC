[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dsc"
version = "0.1.0"
description = "Dynamic State Connectome — MVP runtime"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
ui = [
  "textual>=0.80",
  "rich>=13",
  "pandas>=2.0",
  "pyarrow>=14",
]

[project.scripts]
dsc = "dsc.__main__:main"

[tool.setuptools.packages.find]
include = ["dsc*"]
